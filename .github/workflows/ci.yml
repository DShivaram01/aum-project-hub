name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-infra:
    name: Lint CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cfn-lint
      - run: cfn-lint infra/aws/*.yml

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    name: Docker image smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start app and database
        run: docker compose up -d --build

      - name: Wait for health check
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: Register, log in and create a project
        run: |
          curl -fs -X POST localhost:8080/api/auth/register -H "Content-Type: application/json" \
            -d '{"name":"CI","email":"ci@aum.edu","password":"password123","role":"STUDENT"}'
          TOKEN=$(curl -fs -X POST localhost:8080/api/auth/login -H "Content-Type: application/json" \
            -d '{"email":"ci@aum.edu","password":"password123"}' | jq -r .token)
          curl -fs -X POST localhost:8080/api/projects -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{"title":"CI project","description":"Smoke test"}'
          curl -fs localhost:8080/api/projects | jq -e 'any(.[]; .title == "CI project")'

      - name: Stop containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to AWS
    needs: [docker, lint-infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy-aws
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: build
        name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/aum-project-hub:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition aum-project-hub \
            --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.build.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: aum-project-hub
          service: aum-project-hub
          wait-for-service-stability: true
