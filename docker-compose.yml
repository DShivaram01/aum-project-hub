services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: projecthub
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: projecthub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthub -d projecthub"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/projecthub
      DB_USERNAME: projecthub
      DB_PASSWORD: projecthub
      APP_DEMODATA: "true"
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-key-change-me-0123456789}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
