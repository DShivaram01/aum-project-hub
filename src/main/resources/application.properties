spring.application.name=aum-project-hub

# PostgreSQL connection. Defaults match docker-compose.yml.
# Override with environment variables when deploying (for example on AWS RDS).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/projecthub}
spring.datasource.username=${DB_USERNAME:projecthub}
spring.datasource.password=${DB_PASSWORD:projecthub}

# Let Hibernate create/update tables from the entity classes.
# Fine for development; a migration tool like Flyway would be better later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT settings. Always set JWT_SECRET in real deployments (at least 32 characters).
jwt.secret=${JWT_SECRET:local-dev-secret-key-change-me-0123456789}
# 24 hours
jwt.expiration-ms=86400000
